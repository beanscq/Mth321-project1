name: code demo

on:
  push:
  pull_request:

# the numerical code lives in code/; run everything from there
defaults:
  run:
    working-directory: code

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show environment
        run: |
          python -V
          python -c "import numpy, scipy, matplotlib; print('numpy', numpy.__version__, '| scipy', scipy.__version__, '| matplotlib', matplotlib.__version__)"

      # run the whole numerical study end to end: model self-checks, spectrum,
      # stability limit (swept + bisected), convergence orders, four-track
      # diagnostics, the conservation counter-example, and the endpoint value
      - name: Run the numerical demo
        run: python demo.py --quick
        env:
          MPLBACKEND: Agg

      # keep the two figures the run produces, so the result is inspectable
      # straight from the Actions page
      - name: Upload the generated figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: code/results/
          if-no-files-found: ignore
