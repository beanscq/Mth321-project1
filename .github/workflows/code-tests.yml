name: code tests

on:
  push:
  pull_request:

# the numerical code lives in code/; run every step from there
defaults:
  run:
    working-directory: code

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show environment
        run: |
          python -V
          python -c "import numpy, scipy, matplotlib; print('numpy', numpy.__version__, '| scipy', scipy.__version__, '| matplotlib', matplotlib.__version__)"
          nproc || true
          free -m || true

      - name: Run the test suite
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest_output.txt
        env:
          MPLBACKEND: Agg

      # on failure this puts the pytest output into the run summary, so the
      # reason is readable straight from the Actions page (and the API)
      - name: Publish pytest output
        if: always()
        run: |
          {
            echo '### pytest output (last 250 lines)'
            echo '```'
            tail -250 pytest_output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
